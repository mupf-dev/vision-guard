# Streams werden vom Backend per API verwaltet (cam_<id>)
api:
  listen: ":1984"
  origin: "*"
rtsp:
  listen: ":8554"
webrtc:
  listen: ":8555"
  candidates:
    - 127.0.0.1:8555   # Browser auf demselben Rechner (Docker Desktop / WSL2: Port 8555 wird auf localhost weitergeleitet)
    - stun:8555        # öffentliche Adresse per STUN
ffmpeg:
  # YouTube/HLS: in Echtzeit lesen (-re), sonst kommen die 5-s-Segmente schubweise (Browser-Puffer läuft leer,
  # Worker bekommt Bursts). Gemessen: ohne -re Ankunftsschwankung ~17 s, mit -re < 1 s.
  youtube: "-re -fflags nobuffer+genpts -i {input}"
log:
  level: info
  # R1: Warnungen des Moduls streams enthalten die Quell-URL samt Kamera-Passwort (producer.go: url=rtsp://user:pw@…)
  # → nur Fehler; Ausfälle meldet ohnehin die Kamera-Gesundheit im Backend
  streams: error
streams: {}
