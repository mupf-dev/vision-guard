# Streams werden vom Backend per API verwaltet (cam_<id>)
api:
  listen: ":1984"
  origin: "*"
rtsp:
  listen: ":8554"
webrtc:
  listen: ":8555"
  candidates:
    - stun:8555
ffmpeg:
  # YouTube/HLS: in Echtzeit lesen (-re), sonst kommen Segmente schubweise und Zeitstempel springen
  youtube: "-re -fflags nobuffer+genpts -i {input}"
log:
  level: info
streams: {}
