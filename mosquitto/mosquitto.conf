# R1: zwei Listener mit eigenen Regeln (per_listener_settings)
per_listener_settings true
persistence false
log_dest stdout
# W2 (K2): Nagle aus – sonst bis zu 40 ms Zusatzlatenz je Antwort (RPC vg/internal/embed, Live-Detektionen)
set_tcp_nodelay true

# Intern (nur im Docker-Netz, nicht veröffentlicht): Backend, Worker, vlm – voller Zugriff
listener 1883
allow_anonymous true

# Extern (Host-Port MQTT_PORT, Standard 1883 → 1884): anonym nur LESEN (Home Assistant & Co.).
# Steuernde Topics (vg/internal/gpu/request, cmd, config …) und gefälschte Inventar-/Sensor-Nachrichten sind von
# außen damit nicht mehr möglich.
listener 1884
allow_anonymous true
acl_file /mosquitto/config/acl-extern.conf
