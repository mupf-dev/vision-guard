# VisionGuard – SPA + Reverse-Proxy (siehe CONTRACT.md)
# Docker-DNS + Variablen: nginx startet auch, wenn backend/go2rtc noch nicht laufen.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Hinter einem externen TLS-Proxy/Tunnel dessen X-Forwarded-Proto übernehmen (sonst fehlt „Secure“ am Cookie)
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Anmeldung bremsen (zusätzlich zur Sperre im Backend: 5 Fehlversuche/min je IP → 429)
limit_req_zone $binary_remote_addr zone=vg_login:1m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    set $backend http://backend:8000;
    set $go2rtc  http://go2rtc:1984;

    # Interne Worker-API ist von außen gesperrt
    location ^~ /api/internal/ {
        return 403;
    }

    location = /api/auth/login {
        limit_req zone=vg_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Backend-API inkl. WebSocket (/api/ws)
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # MCP-Server (Streamable HTTP/SSE) – ohne auth_request, der Dienst prüft den API-Key (Authorization: Bearer)
    location /mcp {
        set $mcp http://mcp:8100;
        proxy_pass $mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Medien (Snapshots, Crops, Clips) vom Backend – das Backend prüft selbst Cookie | Bearer | ?exp&sig
    # (auth_request kennt keine signierten Links). Range für <video> wird durchgereicht (206).
    location /media/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, max-age=600";
    }

    # Auth-Subrequest für go2rtc
    location = /_auth_check {
        internal;
        proxy_pass $backend/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    # go2rtc (Live-Streams, WebSocket) – nur mit gültiger Session
    location /go2rtc/ {
        auth_request /_auth_check;
        rewrite ^/go2rtc/(.*)$ /$1 break;
        proxy_pass $go2rtc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Vendor-Player & gehashte Assets lange cachen
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA-Fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
